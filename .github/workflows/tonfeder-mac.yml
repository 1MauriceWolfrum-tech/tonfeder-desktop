name: "Tonfeder macOS"

# Baut die Mac-Version von Tonfeder für Apple Silicon und Intel.
#
# Ohne Apple-Entwicklerzertifikat: Es werden keine APPLE_*-Variablen gesetzt,
# daher signiert Tauri die App nur ad-hoc (signingIdentity "-" in
# tauri.conf.json). macOS fragt deshalb beim ersten Start einmal nach.
#
# Auslöser:
# - Release veröffentlicht: baut und hängt die DMGs an genau dieses Release.
# - Push auf einen tonfeder/*-Branch oder manuell (Actions → Tonfeder macOS →
#   Run workflow): baut nur und legt die DMGs 30 Tage als Artefakt ab. So lässt
#   sich der Mac-Build prüfen, bevor es ein Release gibt.

on:
  release:
    types: [published]
  push:
    branches: ["tonfeder/**"]
  workflow_dispatch:

jobs:
  mac:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: "macos-26" # Apple Silicon (M1 und neuer), macOS-26-SDK wie bei Handy
            target: "aarch64-apple-darwin"
          - runner: "macos-latest" # Intel, cross-kompiliert wie bei Handy
            target: "x86_64-apple-darwin"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Frontend-Abhängigkeiten
        run: bun install

      - name: Bauen
        run: bun run tauri build --target ${{ matrix.target }} --bundles app,dmg

      - name: Prüfsumme
        working-directory: src-tauri/target/${{ matrix.target }}/release/bundle/dmg
        run: |
          ls -l *.dmg
          shasum -a 256 *.dmg | tee "$GITHUB_STEP_SUMMARY"

      - name: Als Artefakt ablegen
        uses: actions/upload-artifact@v7
        with:
          name: tonfeder-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          retention-days: 30

      - name: An das Release hängen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg --clobber --repo "${{ github.repository }}"
